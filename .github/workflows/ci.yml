name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Test and package Chrome extension
        run: |
          node --check extension/background.js
          node --check extension/options.js
          node --check extension/shared.mjs
          node --test extension/tests/*.test.mjs
          python3 scripts/build_extension.py --output /tmp/xunlei-api-chrome-extension.zip
          python3 -m zipfile --test /tmp/xunlei-api-chrome-extension.zip
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Cross-compile Linux binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -buildvcs=false -o "/tmp/xunlei-api-$arch" ./cmd/xunlei-api
          done
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: xunlei-api:ci
          platforms: linux/amd64
          provenance: false
      - name: Smoke-test non-root container
        run: |
          name="xunlei-api-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          volume="$name-data"
          test "$(docker image inspect xunlei-api:ci --format '{{.Config.User}}')" = '65532:65532'
          docker run -d --name "$name" --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=volume,source=$volume,target=/data" \
            -e API_KEY=ci-only-key-00000000000000000000000000000000 \
            -e XUNLEI_BASE_URL=http://127.0.0.1:9 \
            --health-interval=2s --health-start-period=1s xunlei-api:ci
          for ((attempt=1; attempt<=20; attempt++)); do
            if [ "$(docker inspect "$name" --format '{{.State.Health.Status}}')" = healthy ]; then
              docker image inspect xunlei-api:ci --format 'Image size: {{.Size}} bytes'
              exit 0
            fi
            sleep 2
          done
          docker logs "$name"
          docker inspect "$name" --format '{{json .State.Health}}'
          exit 1
      - name: Clean up smoke-test container
        if: always()
        run: |
          name="xunlei-api-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker rm -f "$name" >/dev/null 2>&1 || true
          docker volume rm "$name-data" >/dev/null 2>&1 || true
